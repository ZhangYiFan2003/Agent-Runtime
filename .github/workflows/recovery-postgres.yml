name: Extended PostgreSQL Recovery

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-postgres-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: axiom_ci
          POSTGRES_PASSWORD: axiom_ci
          POSTGRES_DB: axiom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom_ci -d axiom_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AXIOM_TEST_POSTGRES_DSN: postgresql://axiom_ci:axiom_ci@127.0.0.1:5432/axiom_ci
      AXIOM_POSTGRES_CI_REQUIRED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Sync PostgreSQL test dependencies
        run: uv sync --extra dev --extra postgres --locked

      - name: Run extended deterministic recovery matrix
        run: >-
          uv run --locked python -m benchmarks.recovery.run_fault_injection
          --output /tmp/axiom-recovery-baseline.json
