name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Match the Node major used for the validated frontend build. This
          # also avoids Node 22/Linux native-toolchain drift in Vite 8 builds.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Vite 8, Rolldown, Tailwind, and Lightning CSS select native Linux
        # bindings through optional dependencies. Materialize them explicitly
        # while still enforcing the committed lockfile.
        run: npm ci --include=optional

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        shell: bash
        run: |
          log="$RUNNER_TEMP/frontend-build.log"
          if npm exec vite build >"$log" 2>&1; then
            cat "$log"
            exit 0
          fi

          if grep -Eqi 'native binding|optional dependenc|cannot find module.*(binding|oxide|lightningcss)' "$log"; then
            category='native dependency loading'
          elif grep -Eqi 'could not resolve|failed to resolve import|module not found' "$log"; then
            category='module resolution'
          elif grep -Eqi 'failed to load config|config file' "$log"; then
            category='Vite configuration loading'
          elif grep -Eqi 'parse error|syntax error|unexpected token' "$log"; then
            category='source parsing'
          elif grep -Eqi 'heap out of memory|allocation failed' "$log"; then
            category='memory exhaustion'
          elif grep -Eqi 'permission denied|EACCES' "$log"; then
            category='filesystem permission'
          else
            category='unclassified Vite build failure'
          fi

          echo "::error title=Frontend build category::$category"
          exit 1
