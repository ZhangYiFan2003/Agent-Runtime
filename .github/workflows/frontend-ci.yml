name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Vite 8 currently exits inside its Linux native bundler on the hosted
    # runner after typecheck/tests pass. Use the validated Windows toolchain;
    # the repository's primary CI continues to cover Ubuntu separately.
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Match the Node major used for the validated frontend build. This
          # also avoids Node 22/Linux native-toolchain drift in Vite 8 builds.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Vite 8, Rolldown, Tailwind, and Lightning CSS select native Linux
        # bindings through optional dependencies. Materialize them explicitly
        # while still enforcing the committed lockfile.
        run: npm ci --include=optional

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "frontend-build.log"
          & npm.cmd exec vite build *> $log
          $status = $LASTEXITCODE

          if ($status -eq 0) {
            Get-Content -LiteralPath $log
            exit 0
          }

          $content = Get-Content -LiteralPath $log -Raw
          $category = if ($content -match "native binding|optional dependenc|cannot find (module|package).*(binding|oxide|lightningcss)") {
            "native dependency loading"
          } elseif ($content -match "could not resolve|failed to resolve import|module not found|cannot find package") {
            "module resolution"
          } elseif ($content -match "failed to load config|config file") {
            "Vite configuration loading"
          } elseif ($content -match "tailwind|oxide|unknown utility|invalid utility") {
            "Tailwind transform"
          } elseif ($content -match "lightningcss") {
            "Lightning CSS transform"
          } elseif ($content -match "rolldown") {
            "Rolldown transform"
          } elseif ($content -match "plugin-react|oxc|react refresh") {
            "React transform"
          } elseif ($content -match "ENOENT|no such file or directory") {
            "missing filesystem input"
          } elseif ($content -match "spawn|executable") {
            "subprocess launch"
          } elseif ($content -match "ReferenceError|TypeError|RangeError|ERR_") {
            "JavaScript runtime exception"
          } elseif ($content -match "parse error|syntax error|unexpected token") {
            "source parsing"
          } elseif ($content -match "heap out of memory|allocation failed|Killed") {
            "resource exhaustion"
          } elseif ($content -match "permission denied|EACCES|EPERM") {
            "filesystem permission"
          } else {
            "unclassified"
          }

          $phase = if ($content -match "computing gzip size") {
            "report"
          } elseif ($content -match "rendering chunks") {
            "render"
          } elseif ($content -match "transforming") {
            "transform"
          } elseif ($content -match "building client environment") {
            "startup"
          } else {
            "before startup"
          }

          Write-Output "::error title=Frontend build classification::category=$category; phase=$phase"
          exit $status
