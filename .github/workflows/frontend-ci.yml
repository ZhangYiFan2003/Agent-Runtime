name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/frontend-build.log"
          npm run build >"$log" 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            cat "$log"
            exit 0
          fi

          category="unclassified"
          if grep -Eqi "object not disposable|Symbol\.dispose" "$log"; then
            category="object-disposal"
          elif grep -Eqi "cannot read properties|is not a function|object expected" "$log"; then
            category="javascript-type-error"
          elif grep -Eqi "invalid value|missing field" "$log"; then
            category="invalid-plugin-output"
          elif grep -Eqi "unknown utility|invalid utility|cannot apply.*utility" "$log"; then
            category="tailwind-utility"
          elif grep -Eqi "unknown word|CssSyntaxError|CSS syntax" "$log"; then
            category="css-syntax"
          elif grep -Eqi "out of memory|allocation failed|killed" "$log"; then
            category="resource-exhaustion"
          elif grep -Eqi "cannot find (module|package)|could not resolve|failed to resolve" "$log"; then
            category="module-resolution"
          elif grep -Eqi "syntax error|parse error|unexpected token|expression expected" "$log"; then
            category="source-parsing"
          elif grep -Eqi "does not provide an export|not exported" "$log"; then
            category="module-export"
          elif grep -Eqi "permission denied|EACCES|EPERM" "$log"; then
            category="filesystem-permission"
          elif grep -Eqi "native binding|optional dependency|lightningcss" "$log"; then
            category="native-dependency"
          elif grep -Eqi "segmentation fault|panicked at|unreachable" "$log"; then
            category="native-panic"
          elif grep -Eqi "Error:|RollupError" "$log"; then
            category="reported-error"
          fi

          plugin="none-detected"
          if grep -Eqi "tailwind|oxide|vite:css" "$log"; then
            plugin="css-tailwind"
          elif grep -Eqi "plugin-react|react-babel|react refresh" "$log"; then
            plugin="react"
          elif grep -Eqi "vite:esbuild|esbuild" "$log"; then
            plugin="esbuild"
          elif grep -Eqi "commonjs" "$log"; then
            plugin="commonjs"
          elif grep -Eqi "rollup" "$log"; then
            plugin="rollup"
          fi

          phase="before-startup"
          if grep -q "computing gzip size" "$log"; then
            phase="report"
          elif grep -q "rendering chunks" "$log"; then
            phase="render"
          elif grep -q "modules transformed" "$log"; then
            phase="post-transform"
          elif grep -q "transforming" "$log"; then
            phase="transform"
          elif grep -q "building client environment" "$log"; then
            phase="startup"
          fi

          npm exec vite build -- --minify=false >/dev/null 2>&1
          if [ "$?" -eq 0 ]; then
            unminified="pass"
          else
            unminified="fail"
          fi

          echo "::error title=Frontend build classification::category=$category; plugin=$plugin; phase=$phase; unminified=$unminified; exit=$status"
          exit "$status"
