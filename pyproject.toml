[project]
name = "axiom-agent"
version = "0.1.0"
description = "Python terminal AI agent CLI with ReAct tools, MCP, Runtime API, memory, snapshots, web search, and image input"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Axiom Agent Runtime Contributors" }]
keywords = ["agent", "ai", "cli", "llm", "mcp", "react", "terminal"]
dependencies = [
  "httpx>=0.27.0",
  "jieba>=0.42.1",
  "mcp>=1.27,<2",
  "pillow>=10.0",
  "prompt-toolkit>=3.0.43",
  "rich>=13.7.0",
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-java>=0.23.5",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
  "typer>=0.12.3",
]

[project.scripts]
axiom = "axiom.entrypoints.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "tests/fixtures/code_index_project/broken.py",
  "tests/fixtures/symbol_index_project/broken.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
