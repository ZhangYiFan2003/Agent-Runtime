name: axiom

x-runtime-environment: &runtime-environment
  AXIOM_STORAGE_BACKEND: postgres
  AXIOM_POSTGRES_DSN: ${AXIOM_POSTGRES_DSN:?AXIOM_POSTGRES_DSN is required}
  AXIOM_DISTRIBUTED_WORKER: "true"
  AXIOM_WORKER_LEASE_SECONDS: ${AXIOM_WORKER_LEASE_SECONDS:-30}
  AXIOM_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${AXIOM_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
  AXIOM_WORKER_POLL_INTERVAL_SECONDS: ${AXIOM_WORKER_POLL_INTERVAL_SECONDS:-0.5}
  AXIOM_MAX_RUN_DELIVERY_ATTEMPTS: ${AXIOM_MAX_RUN_DELIVERY_ATTEMPTS:-5}
  AXIOM_MAX_QUEUED_RUNS: ${AXIOM_MAX_QUEUED_RUNS:-100}
  AXIOM_MAX_ACTIVE_RUNS: ${AXIOM_MAX_ACTIVE_RUNS:-4}
  AXIOM_MAX_QUEUED_RUNS_PER_PRINCIPAL: ${AXIOM_MAX_QUEUED_RUNS_PER_PRINCIPAL:-100}
  AXIOM_MAX_ACTIVE_RUNS_PER_PRINCIPAL: ${AXIOM_MAX_ACTIVE_RUNS_PER_PRINCIPAL:-4}
x-provider-client-environment: &provider-client-environment
  AXIOM_PROVIDER: gateway
  AXIOM_MODEL: ${AXIOM_GATEWAY_ROUTE:-default}
  AXIOM_GATEWAY_ROUTE: ${AXIOM_GATEWAY_ROUTE:-default}
  AXIOM_GATEWAY_URL: http://providerd:8070
x-artifact-client-environment: &artifact-client-environment
  AXIOM_ARTIFACTS_ENABLED: "true"
  AXIOM_ARTIFACTS_BACKEND: s3
  AXIOM_ARTIFACT_S3_ENDPOINT: http://minio:9000
  AXIOM_ARTIFACT_S3_BUCKET: ${AXIOM_ARTIFACT_S3_BUCKET:-axiom-artifacts}
  AXIOM_ARTIFACT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  AXIOM_ARTIFACT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  AXIOM_ARTIFACT_S3_SECURE: "false"
x-sandbox-environment: &sandbox-environment
  AXIOM_SANDBOX_IMAGE: ${AXIOM_SANDBOX_IMAGE:-axiom-sandbox:local}
  AXIOM_SANDBOX_WORKSPACE_SOURCE: ${AXIOM_SANDBOX_WORKSPACE_SOURCE:-axiom_workspace_data}
  AXIOM_SANDBOX_CPU_LIMIT: ${AXIOM_SANDBOX_CPU_LIMIT:-1.0}
  AXIOM_SANDBOX_MEMORY_LIMIT_BYTES: ${AXIOM_SANDBOX_MEMORY_LIMIT_BYTES:-536870912}
  AXIOM_SANDBOX_PIDS_LIMIT: ${AXIOM_SANDBOX_PIDS_LIMIT:-128}
  AXIOM_SANDBOX_TMPFS_SIZE_BYTES: ${AXIOM_SANDBOX_TMPFS_SIZE_BYTES:-67108864}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-axiom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - internal

  minio:
    image: cgr.dev/chainguard/minio@sha256:d7c906993247627c19f37fc1fa302c34cf2d209ae0e7dc7d52fb0be6ac2849ba
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - artifact_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - artifact-storage

  minio-init:
    image: axiom-runtime:local
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AXIOM_ARTIFACT_S3_BUCKET: ${AXIOM_ARTIFACT_S3_BUCKET:-axiom-artifacts}
    entrypoint: ["python", "-c"]
    command:
      - |
        import os
        from minio import Minio

        client = Minio(
            "minio:9000",
            access_key=os.environ["MINIO_ROOT_USER"],
            secret_key=os.environ["MINIO_ROOT_PASSWORD"],
            secure=False,
        )
        bucket = os.environ["AXIOM_ARTIFACT_S3_BUCKET"]
        if not client.bucket_exists(bucket):
            client.make_bucket(bucket)
    networks:
      - artifact-storage

  runtime-api:
    image: axiom-runtime:local
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --task-workers
      - "0"
      - --cwd
      - /workspace
      - --data-dir
      - /var/lib/axiom
    restart: unless-stopped
    environment:
      <<: [*runtime-environment, *artifact-client-environment]
      AXIOM_RUNTIME_API_KEY: ${AXIOM_RUNTIME_API_KEY:?AXIOM_RUNTIME_API_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ${AXIOM_WORKSPACE_MOUNT:-workspace_data}:/workspace
      - runtime_data:/var/lib/axiom
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s
    networks:
      - internal
      - artifact-storage

  worker:
    image: axiom-runtime:local
    command:
      - worker
      - --cwd
      - /workspace
      - --data-dir
      - /var/lib/axiom
    restart: unless-stopped
    environment:
      <<: [*runtime-environment, *sandbox-environment, *provider-client-environment, *artifact-client-environment]
      AXIOM_EXECUTION_BACKEND: sandbox
      AXIOM_SANDBOX_CONTROLLER_URL: http://sandboxd:8090
    depends_on:
      postgres:
        condition: service_healthy
      sandboxd:
        condition: service_healthy
      providerd:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ${AXIOM_WORKSPACE_MOUNT:-workspace_data}:/workspace
      - runtime_data:/var/lib/axiom
    stop_grace_period: 35s
    networks:
      - internal
      - sandbox-control
      - provider-control
      - artifact-storage

  providerd:
    image: axiom-runtime:local
    command:
      - providerd
      - --host
      - 0.0.0.0
      - --port
      - "8070"
      - --cwd
      - /workspace
    restart: unless-stopped
    environment:
      AXIOM_API_KEY: ${AXIOM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AXIOM_PROVIDER_ROUTES_JSON: ${AXIOM_PROVIDER_ROUTES_JSON:-}
      AXIOM_PROVIDER_GATEWAY_REQUEST_MAX_BYTES: ${AXIOM_PROVIDER_GATEWAY_REQUEST_MAX_BYTES:-2097152}
      AXIOM_PROVIDER_GATEWAY_MAX_MESSAGES: ${AXIOM_PROVIDER_GATEWAY_MAX_MESSAGES:-512}
      AXIOM_PROVIDER_GATEWAY_MAX_TOOL_SCHEMA_BYTES: ${AXIOM_PROVIDER_GATEWAY_MAX_TOOL_SCHEMA_BYTES:-524288}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8070/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - provider-control

  sandboxd:
    image: axiom-runtime:local
    command:
      - sandboxd
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --cwd
      - /workspace
    user: "0:0"
    restart: unless-stopped
    environment:
      <<: *sandbox-environment
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - sandbox-control

  sandbox-image:
    image: ${AXIOM_SANDBOX_IMAGE:-axiom-sandbox:local}
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    profiles:
      - sandbox-build
    command: ["true"]

  web:
    image: axiom-web:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      runtime-api:
        condition: service_healthy
    ports:
      - "${AXIOM_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - internal

volumes:
  postgres_data:
  artifact_data:
  runtime_data:
  workspace_data:

networks:
  internal:
    driver: bridge
  sandbox-control:
    driver: bridge
    internal: true
  provider-control:
    driver: bridge
    internal: true
  artifact-storage:
    driver: bridge
    internal: true
